project_id = "contracktor"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = false

# These functions authenticate inside their handlers instead of relying on the
# platform's legacy JWT gateway. This keeps user calls compatible with rotated
# asymmetric signing keys and lets cron workers use their dedicated secret.
[functions.tell-contracktor]
verify_jwt = false

[functions.process-receipt-queue]
verify_jwt = false

[functions.process-tell-queue]
verify_jwt = false

[analytics]
enabled = false
